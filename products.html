<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | FreshMart Sri Lanka</title>
    <meta name="description" content="Browse all FreshMart products, filter by category, and add items to your cart." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M18 22h28l-3 20H21z' fill='%23fff'/%3E%3Ccircle cx='25' cy='46' r='3' fill='%23f59e0b'/%3E%3Ccircle cx='39' cy='46' r='3' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a class="logo" href="./index.html">FreshMart</a>
        <nav class="nav-links">
          <a href="./index.html">Home</a>
          <a href="./index.html#categories">Categories</a>
          <a href="./products.html">Products</a>
          <a href="./cart.html">Cart</a>
        </nav>
        <a class="cart-link" href="./cart.html">
          Cart <span class="cart-count">0</span>
        </a>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">FreshMart products</p>
          <h1>Shop groceries by category and price</h1>
          <p>Search, filter, and add everything you need to your cart.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="controls">
            <input id="search-input" type="search" placeholder="Search products" />
            <select id="category-filter">
              <option value="all">All categories</option>
            </select>
          </div>
          <div id="products-grid" class="product-grid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-wrap">
        <div>
          <h3>FreshMart Sri Lanka</h3>
          <p>Easy grocery shopping for modern homes.</p>
        </div>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('search-input');
        const categoryFilter = document.getElementById('category-filter');
        populateCategoryFilter(categoryFilter);

        const params = new URLSearchParams(window.location.search);
        const initialCategory = params.get('category');
        if (initialCategory) {
          categoryFilter.value = initialCategory;
        }

        const render = () => renderProductGrid('products-grid', searchInput.value, categoryFilter.value);
        searchInput.addEventListener('input', render);
        categoryFilter.addEventListener('change', render);
        render();
        updateCartCount();
      });
    </script>
  </body>
</html>
