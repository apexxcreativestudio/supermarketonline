<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | FreshMart Sri Lanka</title>
    <meta name="description" content="Review your FreshMart cart and proceed to checkout with WhatsApp." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M18 22h28l-3 20H21z' fill='%23fff'/%3E%3Ccircle cx='25' cy='46' r='3' fill='%23f59e0b'/%3E%3Ccircle cx='39' cy='46' r='3' fill='%23f59e0b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-wrap">
        <a class="logo" href="./index.html">FreshMart</a>
        <nav class="nav-links">
          <a href="./index.html">Home</a>
          <a href="./index.html#categories">Categories</a>
          <a href="./products.html">Products</a>
          <a href="./cart.html">Cart</a>
        </nav>
        <a class="cart-link" href="./cart.html">
          Cart <span class="cart-count">0</span>
        </a>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Your basket</p>
          <h1>Review your selections</h1>
          <p>Everything saved locally so you can continue without losing your cart.</p>
        </div>
      </section>

      <section class="section">
        <div class="container cart-layout">
          <div id="cart-items" class="cart-items"></div>
          <aside class="cart-summary">
            <h3>Order summary</h3>
            <div id="cart-total" class="summary-box"></div>
            <a class="btn btn-primary full-width" href="./checkout.html">Proceed to Checkout</a>
          </aside>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-wrap">
        <div>
          <h3>FreshMart Sri Lanka</h3>
          <p>Fast and friendly grocery ordering for every household.</p>
        </div>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        renderCartPage();
        updateCartCount();
      });
    </script>
  </body>
</html>
